<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prosa — painel da família</title>
<style>
  /* Sem CDN e sem biblioteca de gráfico: os gráficos são SVG gerado no
     próprio script. A demo não pode depender do wi-fi do evento. */
  :root {
    --fundo: #faf8f5;
    --cartao: #ffffff;
    --borda: #e8e2d9;
    --texto: #2d2a26;
    --suave: #6f6960;
    --verde: #2e7d52;
    --amarelo: #b8860b;
    --vermelho: #b23b3b;
    --cinza: #8b8780;
    --acento: #4a5d7e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .envelope { max-width: 1060px; margin: 0 auto; padding: 24px 20px 64px; }

  .aviso-simulado {
    background: #fff4d6;
    border: 2px solid #e0b949;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 22px;
    font-weight: 600;
    color: #6b4f0b;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .aviso-simulado small { display: block; font-weight: 400; margin-top: 3px; }

  header.topo { margin-bottom: 26px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; font-weight: 650; }
  .sub { color: var(--suave); font-size: 0.92rem; }

  .destaque {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-left: 7px solid var(--cinza);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 26px;
  }
  .destaque.verde      { border-left-color: var(--verde); }
  .destaque.amarelo    { border-left-color: var(--amarelo); }
  .destaque.vermelho   { border-left-color: var(--vermelho); }
  .destaque.calibrando { border-left-color: var(--cinza); }

  .destaque-titulo {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.16rem; font-weight: 650; margin-bottom: 6px;
  }
  .destaque-msg { color: #45413b; }
  .pastilhas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .pastilha {
    background: #f4f1ec; border: 1px solid var(--borda);
    border-radius: 999px; padding: 4px 13px; font-size: 0.86rem;
  }

  h2 { font-size: 1.04rem; margin: 30px 0 14px; font-weight: 620; }

  .grade {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
  }
  .medida {
    background: var(--cartao); border: 1px solid var(--borda);
    border-radius: 11px; padding: 14px 15px 10px;
  }
  .medida-nome { font-size: 0.87rem; color: var(--suave); margin-bottom: 7px; }
  .medida-valor { font-size: 1.32rem; font-weight: 640; }
  .medida-base { font-size: 0.78rem; color: var(--suave); margin-top: 2px; }
  svg.spark { display: block; width: 100%; height: 48px; margin-top: 9px; }

  table { width: 100%; border-collapse: collapse; background: var(--cartao); }
  table, th, td { border: 1px solid var(--borda); }
  th, td { padding: 9px 12px; text-align: left; font-size: 0.9rem; vertical-align: top; }
  th { background: #f4f1ec; font-weight: 600; }
  td.cor { white-space: nowrap; font-weight: 600; }

  .rodape {
    margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--borda);
    color: var(--suave); font-size: 0.84rem;
  }
  .rodape strong { color: var(--texto); }
  .erro { color: var(--vermelho); padding: 18px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #1b1917; --cartao: #252220; --borda: #3a3632;
      --texto: #eceae7; --suave: #a39d94;
      --verde: #63c38d; --amarelo: #e0b949; --vermelho: #e58080; --cinza: #8b8780;
    }
    .aviso-simulado { background: #3a2f12; color: #f0d79a; border-color: #8a6d1f; }
    th { background: #2e2a27; }
    .pastilha { background: #2e2a27; }
    .destaque-msg { color: #d6d2cc; }
  }
</style>
</head>
<body>
<div class="envelope" id="raiz">
  <p class="sub">Carregando…</p>
</div>

<script>
const PARAMS = new URLSearchParams(location.search);
const PESSOA = PARAMS.get('pessoa') || '1';

const EMOJI = { calibrando: '⚪', verde: '🟢', amarelo: '🟡', vermelho: '🔴' };
const TITULO = {
  calibrando: 'Conhecendo o jeito dela de falar',
  verde: 'Dentro do normal dela',
  amarelo: 'Algo mudou hoje',
  vermelho: 'A mudança se manteve',
};

// Medidas destacadas em cartão (as demais ficam na tabela de histórico).
const DESTAQUES = [
  'taxa_articulacao_sil_s',
  'proporcao_pausas',
  'duracao_media_pausa_s',
  'variacao_tom_st',
  'palavras_por_turno',
  'bichos_diferentes',
];

const FORMATO = {
  taxa_articulacao_sil_s: (v) => v.toFixed(2) + ' síl/s',
  proporcao_pausas:       (v) => (v * 100).toFixed(0) + '%',
  duracao_media_pausa_s:  (v) => v.toFixed(2) + ' s',
  variacao_tom_st:        (v) => v.toFixed(2) + ' st',
  palavras_por_turno:     (v) => v.toFixed(1),
  bichos_diferentes:      (v) => String(Math.round(v)),
  mattr:                  (v) => v.toFixed(3),
  jitter_local:           (v) => (v * 100).toFixed(2) + '%',
  shimmer_local:          (v) => (v * 100).toFixed(1) + '%',
  hnr_db:                 (v) => v.toFixed(1) + ' dB',
};

const fmt = (chave, v) =>
  v === null || v === undefined ? '—' : (FORMATO[chave] || ((x) => x.toFixed(2)))(v);

const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** Sparkline em SVG puro. Marca a faixa da linha de base em cinza. */
function sparkline(valores, base) {
  const pontos = valores.filter((v) => v !== null && v !== undefined);
  if (pontos.length < 2) return '<svg class="spark"></svg>';

  const L = 6, R = 6, T = 6, B = 6, W = 240, H = 48;
  let min = Math.min(...pontos), max = Math.max(...pontos);
  if (base) {
    min = Math.min(min, base.media - 2 * base.desvio);
    max = Math.max(max, base.media + 2 * base.desvio);
  }
  if (max - min < 1e-9) { max += 1; min -= 1; }

  const x = (i) => L + (i * (W - L - R)) / Math.max(1, valores.length - 1);
  const y = (v) => T + (H - T - B) * (1 - (v - min) / (max - min));

  let faixa = '';
  if (base && base.desvio > 0) {
    const y1 = y(base.media + 2 * base.desvio);
    const y2 = y(base.media - 2 * base.desvio);
    faixa =
      `<rect x="${L}" y="${y1.toFixed(1)}" width="${W - L - R}" ` +
      `height="${Math.abs(y2 - y1).toFixed(1)}" fill="currentColor" opacity="0.08"/>` +
      `<line x1="${L}" y1="${y(base.media).toFixed(1)}" x2="${W - R}" ` +
      `y2="${y(base.media).toFixed(1)}" stroke="currentColor" ` +
      `stroke-opacity="0.3" stroke-dasharray="3 3"/>`;
  }

  // Quebra a linha em segmentos para não ligar pontos através de buracos.
  const segmentos = [];
  let atual = [];
  valores.forEach((v, i) => {
    if (v === null || v === undefined) { if (atual.length) segmentos.push(atual); atual = []; }
    else atual.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  });
  if (atual.length) segmentos.push(atual);

  const linhas = segmentos
    .filter((s) => s.length > 1)
    .map((s) => `<polyline points="${s.join(' ')}" fill="none" stroke="var(--acento)" stroke-width="2"/>`)
    .join('');

  const ultimo = valores.length - 1;
  const vUlt = valores[ultimo];
  const bola = (vUlt === null || vUlt === undefined)
    ? ''
    : `<circle cx="${x(ultimo).toFixed(1)}" cy="${y(vUlt).toFixed(1)}" r="3.4" fill="var(--acento)"/>`;

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${faixa}${linhas}${bola}</svg>`;
}

function render(d) {
  const sessoes = d.sessoes || [];
  const ultima = sessoes[sessoes.length - 1] || { status: 'calibrando', mensagem: '' };
  const status = ultima.status || 'calibrando';
  const p = d.pessoa;

  const selo = d.dados_simulados
    ? `<div class="aviso-simulado">
         <span>⚠️</span>
         <span>DADOS SIMULADOS — esta pessoa não existe.
           <small>As medidas deste painel foram geradas por script para demonstrar
           a lógica do semáforo. Nenhuma pessoa real foi gravada.</small>
         </span>
       </div>`
    : '';

  const cartoes = DESTAQUES.map((chave) => {
    const serie = d.series[chave] || [];
    const base = d.linha_base[chave];
    const vals = serie.filter((v) => v !== null && v !== undefined);
    const atual = vals.length ? vals[vals.length - 1] : null;
    return `<div class="medida">
      <div class="medida-nome">${esc(d.rotulos[chave] || chave)}</div>
      <div class="medida-valor">${esc(fmt(chave, atual))}</div>
      <div class="medida-base">${
        base ? 'linha de base ' + esc(fmt(chave, base.media)) : 'linha de base em formação'
      }</div>
      ${sparkline(serie, base)}
    </div>`;
  }).join('');

  const linhas = sessoes.slice().reverse().map((s, i) => {
    const data = new Date(s.iniciada_em);
    const quando = isNaN(data) ? s.iniciada_em : data.toLocaleDateString('pt-BR');
    const st = s.status || 'calibrando';
    const muda = (s.mudancas || []).filter(Boolean);
    return `<tr>
      <td>${sessoes.length - i}</td>
      <td>${esc(quando)}</td>
      <td class="cor">${EMOJI[st] || ''} ${esc(st)}</td>
      <td>${muda.length ? esc(muda.join(' · ')) : '—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('raiz').innerHTML = `
    ${selo}
    <header class="topo">
      <h1>${esc(p.nome)}${p.idade ? ', ' + p.idade + ' anos' : ''}</h1>
      <div class="sub">
        ${sessoes.length} conversa(s) · linha de base formada com as primeiras
        ${d.sessoes_linha_base} conversas dela
      </div>
    </header>

    <section class="destaque ${esc(status)}">
      <div class="destaque-titulo">
        <span>${EMOJI[status] || ''}</span>
        <span>${esc(TITULO[status] || status)}</span>
      </div>
      <div class="destaque-msg">${esc(ultima.mensagem || '')}</div>
      ${
        (ultima.mudancas || []).filter(Boolean).length
          ? `<div class="pastilhas">${ultima.mudancas
              .filter(Boolean)
              .map((m) => `<span class="pastilha">${esc(m)}</span>`)
              .join('')}</div>`
          : ''
      }
    </section>

    <h2>Como ela está falando</h2>
    <div class="grade">${cartoes}</div>

    <h2>Conversa por conversa</h2>
    <table>
      <thead><tr><th>#</th><th>Dia</th><th>Situação</th><th>O que mudou</th></tr></thead>
      <tbody>${linhas || '<tr><td colspan="4">Nenhuma conversa ainda.</td></tr>'}</tbody>
    </table>

    <div class="rodape">
      <p><strong>O Prosa não faz diagnóstico.</strong> Ele compara a pessoa com ela
      mesma e avisa quando algo mudou. Qualquer avaliação de saúde é de um
      profissional.</p>
      <p>A família vê tendências, nunca gravações: o áudio é apagado logo após a
      análise e nunca é armazenado.</p>
    </div>`;
}

fetch(`/api/painel/${encodeURIComponent(PESSOA)}`)
  .then((r) => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(render)
  .catch((e) => {
    document.getElementById('raiz').innerHTML =
      `<p class="erro">Não foi possível carregar o painel (${esc(e.message)}).<br>
       O serviço de análise está rodando? Tente
       <code>uvicorn prosa_analise.app:app --port 8000</code>.</p>`;
  });
</script>
</body>
</html>
