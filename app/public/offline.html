<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prosa — sem internet</title>
<!--
  Tela de "sem internet" do Prosa.
  FEITO NO HACKATHON (UNMUTE by Agora, 21-22/11/2026).

  Escrita para ser lida por quem tem 78 anos e pouca familiaridade com
  celular. Regras aplicadas aqui:
    - nenhuma palavra técnica: "internet", não "conexão de rede" nem "offline"
    - diz O QUE FAZER, não o que deu errado
    - fonte muito grande, contraste alto
    - um botão só, do tamanho de um dedo inteiro
    - nenhum código de erro na tela
-->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: #101010;
    color: #f5f3f0;
    font: 400 1.4rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .caixa { max-width: 32rem; }
  .icone { font-size: 5rem; line-height: 1; margin-bottom: 1.5rem; }
  h1 {
    font-size: 2.4rem;
    line-height: 1.2;
    margin: 0 0 1.25rem;
    font-weight: 600;
  }
  p { margin: 0 0 1.25rem; color: #d6d2cc; }
  button {
    margin-top: 1.5rem;
    width: 100%;
    min-height: 5.5rem;
    border: 0;
    border-radius: 1.5rem;
    background: #4ad9a4;
    color: #08140f;
    font: 600 1.6rem/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    cursor: pointer;
  }
  button:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
  button:active { transform: scale(0.99); }
</style>
</head>
<body>
  <div class="caixa">
    <div class="icone" aria-hidden="true">📶</div>
    <h1>Estamos sem internet</h1>
    <p>A Clara precisa de internet para conversar com você.</p>
    <p>Veja se o wi-fi está ligado e tente de novo.</p>
    <button type="button" onclick="location.reload()">
      Tentar de novo
    </button>
  </div>
</body>
</html>
